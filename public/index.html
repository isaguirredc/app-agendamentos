<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oficina Mecânica</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <h1>Agendamento Oficina Mecânica</h1>

    <form id="form">

        <input type="text" id="cliente" placeholder="Cliente" required>

        <input type="text" id="veiculo" placeholder="Veículo" required>

        <input type="text" id="placa" placeholder="Placa" required>

        <input type="text" id="servico" placeholder="Serviço" required>

        <input type="date" id="data" required>

        <input type="time" id="horario" required>

        <button type="submit">Agendar</button>

    </form>

    <div id="lista"></div>

    </div>

        <script src="script.js"></script>

</body>
</html>
